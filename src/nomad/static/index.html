<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      gap: 16px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #fff;
      margin-top: 8px;
    }

    /* Camera */
    #preview {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3/4;
      border-radius: 14px;
      object-fit: cover;
      background: #000;
      display: none;
    }

    #preview-placeholder {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3/4;
      background: #1c1c1e;
      border: 1px solid #333;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #888;
      font-size: 0.9rem;
    }

    #preview-placeholder::before {
      content: "📷";
      font-size: 2rem;
    }

    /* Mic bar */
    #mic-wrap {
      width: 100%;
      max-width: 480px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    #mic-label {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #mic-bar-track {
      width: 100%;
      height: 6px;
      background: #2a2a2a;
      border-radius: 99px;
      overflow: hidden;
    }

    #mic-bar {
      height: 100%;
      width: 0%;
      background: #34d399;
      border-radius: 99px;
      transition: width 0.05s linear;
    }

    /* Status pills */
    #status-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      padding: 4px 12px;
      border-radius: 99px;
      background: #2a2a2a;
      color: #666;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .pill.ok  { background: #052e16; color: #34d399; }
    .pill.err { background: #450a0a; color: #f87171; }

    /* Button */
    #btn {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: #fff;
      color: #000;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    #btn:active   { opacity: 0.85; }
    #btn.stop     { background: #ef4444; color: #fff; }
    #btn:disabled, #reset-btn:disabled { opacity: 0.4; pointer-events: none; }

    #reset-btn {
      width: 100%;
      max-width: 480px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    #reset-btn:active { background: #1c1c1e; }
  </style>
</head>
<body>
  <h1>ECHO GUIDE</h1>

  <video id="preview" autoplay muted playsinline></video>
  <div id="preview-placeholder">Camera off</div>

  <div id="mic-wrap">
    <span id="mic-label">Mic Level</span>
    <div id="mic-bar-track"><div id="mic-bar"></div></div>
  </div>

  <div id="status-row">
    <span class="pill" id="pill-audio">Audio</span>
    <span class="pill" id="pill-video">Video</span>
    <span class="pill" id="pill-gemini">Gemini</span>
  </div>

  <button id="btn">Start</button>
  <button id="reset-btn">↺ Reset Session</button>

  <script src="/static/stream.js"></script>
</body>
</html>
